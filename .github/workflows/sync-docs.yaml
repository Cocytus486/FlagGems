name: Sync docs branch
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
        continue-on-error: true
      - uses: ./.github/actions/checkout-retry
        with:
          submodules: recursive
          fetch-depth: "0"

      - id: rebase
        run: |
          DEFAULT_BRANCH="origin/${{ github.event.repository.default_branch }}"
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout -B gh-pages refs/remotes/origin/gh-pages
            git rebase "${DEFAULT_BRANCH}"
          else
            git checkout -B gh-pages "${DEFAULT_BRANCH}"
          fi
          git push -u origin gh-pages -f
